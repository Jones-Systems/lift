appId: com.jonessystems.form.private
name: 06-settings
---
- runFlow: helpers/ensure-home.yaml
- tapOn:
    id: a-account-entry
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 30000
- tapOn:
    id: a-mode-advanced
# Maestro iOS exposes React Native radio state as text, not its checked boolean.
- assertVisible:
    id: a-mode-advanced
    text: "radio button, checked"
- tapOn:
    id: a-mode-basic
- assertVisible:
    id: a-mode-basic
    text: "radio button, checked"
- scrollUntilVisible:
    element:
      id: a-row-name
    direction: DOWN
    timeout: 20000
    centerElement: false
# The settings row exposes its label and value as one accessible text.
- assertVisible:
    id: a-row-name
    text: "Name, ${E2E_EXPECTED_NAME}"
- tapOn:
    id: a-row-name
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 30000
- tapOn:
    id: a-back
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 30000
- scrollUntilVisible:
    element:
      id: a-unit-load
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-unit-load-${E2E_EXPECTED_LOAD_UNIT}
# Options are flat in the iOS hierarchy; each carries its own derived ID.
- assertVisible:
    id: a-unit-load-${E2E_EXPECTED_LOAD_UNIT}
    text: "radio button, checked"
- scrollUntilVisible:
    element:
      id: a-row-privacy
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-row-privacy
- extendedWaitUntil:
    visible:
      id: screen-settings-privacy
    timeout: 30000
- assertVisible:
    id: a-privacy-title
- tapOn:
    id: a-back
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 30000
- tapOn:
    id: a-account-entry
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 30000
- scrollUntilVisible:
    element:
      id: a-row-name
    direction: DOWN
    timeout: 20000
    centerElement: false
- assertVisible:
    id: a-row-name
    text: "Name, ${E2E_EXPECTED_NAME}"
- scrollUntilVisible:
    element:
      id: a-unit-load
    direction: DOWN
    timeout: 20000
    centerElement: false
- assertVisible:
    id: a-unit-load-${E2E_EXPECTED_LOAD_UNIT}
    text: "radio button, checked"
- takeScreenshot: 06-settings
- scrollUntilVisible:
    element:
      id: a-back
    direction: UP
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-back
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 30000
