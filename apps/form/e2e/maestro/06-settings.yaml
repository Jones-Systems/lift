appId: com.jonessystems.form.private
name: 06-settings
---
- runFlow: helpers/ensure-home.yaml
- tapOn:
    id: a-account-entry
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 30000
- tapOn:
    id: a-mode-advanced
# Maestro iOS exposes React Native radio state as text, not its checked boolean.
- assertVisible:
    id: a-mode-advanced
    text: "radio button, checked"
- tapOn:
    id: a-mode-basic
- assertVisible:
    id: a-mode-basic
    text: "radio button, checked"
- scrollUntilVisible:
    element:
      id: a-row-name
    direction: DOWN
    timeout: 20000
    centerElement: false
# The settings row exposes its label and value as one accessible text.
- assertVisible:
    id: a-row-name
    text: "Name, ${E2E_EXPECTED_NAME}"
- tapOn:
    id: a-row-name
- extendedWaitUntil:
    visible:
      id: screen-account
    timeout: 30000
- tapOn:
    id: a-back
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 30000
- scrollUntilVisible:
    element:
      id: a-unit-load
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn: "${E2E_EXPECTED_LOAD_UNIT}"
# Find the checked radio first, then its label on the radio or a child node.
- assertVisible:
    text: "${E2E_EXPECTED_LOAD_UNIT}"
    childOf:
      text: "radio button, checked"
      childOf:
        id: a-unit-load
- scrollUntilVisible:
    element:
      id: a-row-privacy
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-row-privacy
- extendedWaitUntil:
    visible:
      id: screen-settings-privacy
    timeout: 30000
- assertVisible:
    id: a-privacy-title
- tapOn:
    id: a-back
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 30000
- tapOn:
    id: a-account-entry
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 30000
- scrollUntilVisible:
    element:
      id: a-row-name
    direction: DOWN
    timeout: 20000
    centerElement: false
- assertVisible:
    id: a-row-name
    text: "Name, ${E2E_EXPECTED_NAME}"
- scrollUntilVisible:
    element:
      id: a-unit-load
    direction: DOWN
    timeout: 20000
    centerElement: false
- assertVisible:
    text: "${E2E_EXPECTED_LOAD_UNIT}"
    childOf:
      text: "radio button, checked"
      childOf:
        id: a-unit-load
- takeScreenshot: 06-settings
- scrollUntilVisible:
    element:
      id: a-back
    direction: UP
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-back
- extendedWaitUntil:
    visible:
      id: screen-today
    timeout: 30000
