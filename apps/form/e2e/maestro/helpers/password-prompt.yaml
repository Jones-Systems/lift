appId: com.jonessystems.form.private
---
# Maestro 2.11 shares this non-interacting wait with the caller's 30s window.
# The native prompt can arrive after the app's next screen becomes visible.
- extendedWaitUntil:
    visible: "Save Password.*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
