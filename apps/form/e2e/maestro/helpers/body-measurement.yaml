appId: com.jonessystems.form.private
# Body screens keep a sticky footer over the list. Centre each target so a
# partly covered row is never tapped through to the footer action.
---
- extendedWaitUntil:
    visible:
      id: body-measure
    timeout: 30000
- tapOn:
    id: body-construct-stature
- scrollUntilVisible:
    element:
      id: body-value-input
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: body-value-input
- inputText: "170"
# The decimal pad has no return key and its delete key has no `delete` id, so
# hideKeyboard treats it as already hidden. A tap on a plain label is not
# handled by any control, so the list dismisses the keyboard.
- tapOn: 'Who measured\?'
- extendedWaitUntil:
    notVisible: "Delete"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: body-by-self
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: body-by-self
- scrollUntilVisible:
    element:
      id: body-tool-tape
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn:
    id: body-tool-tape
- tapOn:
    id: body-measure-commit
- scrollUntilVisible:
    element:
      id: body-added-stature:none
    direction: DOWN
    timeout: 20000
    centerElement: true
# Pressable rows expose label, optional detail and value as one accessible text.
- assertVisible:
    id: body-added-stature:none
    text: 'Standing height, 170\.0 cm'
- tapOn:
    id: a-footer-secondary
- extendedWaitUntil:
    visible:
      id: body-results
    timeout: 30000
- assertVisible:
    id: "body-result-stature:none"
    text: 'Standing height, .*, 170\.0 cm'
