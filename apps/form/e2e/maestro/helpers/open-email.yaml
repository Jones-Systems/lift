appId: com.jonessystems.form.private
---
# Capability resolution removes the connection notice and moves the email buttons.
- extendedWaitUntil:
    notVisible:
      id: a-signin-error
    timeout: 30000
- runFlow:
    when:
      visible:
        id: a-signin-email
    commands:
      - tapOn:
          id: a-signin-email
- runFlow:
    when:
      visible:
        id: a-signin-email-link
    commands:
      - tapOn:
          id: a-signin-email-link
- extendedWaitUntil:
    visible:
      id: screen-email
    timeout: 30000
