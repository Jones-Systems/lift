appId: com.jonessystems.form.private
name: 01-auth-create
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: screen-sign-in
    timeout: 30000
- runFlow: helpers/open-email.yaml
- scrollUntilVisible:
    element:
      id: a-email-field-input
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-email-field-input
- eraseText
- inputText: "${E2E_EMAIL}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: a-password-field-input
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-password-field-input
- eraseText
- inputText: "${E2E_PASSWORD}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: a-email-submit
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-email-submit
- scrollUntilVisible:
    element:
      id: a-email-error
    direction: UP
    timeout: 30000
    centerElement: false
- assertVisible: "That email and password don’t match an account.*"
- scrollUntilVisible:
    element:
      id: a-email-mode
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-email-mode
- scrollUntilVisible:
    element:
      id: a-name-field-input
    direction: UP
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-name-field-input
- eraseText
- inputText: "${E2E_NAME}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: a-email-submit
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: a-email-submit
- runFlow: helpers/password-prompt.yaml
- extendedWaitUntil:
    visible:
      id: screen-onboarding-name
    timeout: 30000
- takeScreenshot: 01-auth-create
