name: Lift public checks
run-name: >-
  lift-pair/v1 head=${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }} base=${{ github.event.pull_request.base.sha || 'none' }} ref=${{ github.event.pull_request.base.ref || github.ref_name }}


on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: lift-public-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    name: Public app, API and portable checks
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_FORM_API_URL: http://127.0.0.1:9
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check CI placement contract
        run: python3 -B scripts/ci-placement.test.py
      - name: Run named public groups with locked dependencies
        run: python3 -B scripts/run-public-checks.py --install --output public-check-evidence
      - name: Retain selected commands and exact source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lift-public-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-check-evidence/
          retention-days: 1
          if-no-files-found: error
