name: Lift iOS simulator
run-name: >-
  lift-pair/v1 head=${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }} base=${{ github.event.pull_request.base.sha || 'none' }} ref=${{ github.event.pull_request.base.ref || github.ref_name }}


on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lift commit SHA to build (40 lowercase hexadecimal characters)
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'apps/**'
      - 'services/**'
      - 'packages/**'
      - '.gitattributes'
      - '.github/workflows/form-ios-simulator.yml'
      - 'scripts/native-impact.py'
      - 'scripts/native-impact.test.py'
      - 'scripts/ci-placement.test.py'

permissions:
  contents: read

concurrency:
  group: lift-ios-${{ github.event_name }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  simulator:
    name: Unsigned simulator app and launch evidence
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_FORM_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          persist-credentials: false
      - name: Validate source identity
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Record native inputs (shadow only)
        id: native_identity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tooling/scripts/native-impact.test.py
          python3 tooling/scripts/native-impact.py --source source --tooling tooling
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check driver lifecycle
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tooling/apps/form/scripts/ci-ios-simulator.test.py
      - name: Build and launch exact source
        id: native_build
        timeout-minutes: 55
        run: python3 tooling/apps/form/scripts/ci-ios-simulator.py --source source --output evidence --scratch-parent "$GITHUB_WORKSPACE" --sha "$SOURCE_SHA"
      - name: Retain app and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lift-ios-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: native executed ${{ steps.native_identity.outputs.input_digest }}
        if: ${{ success() && steps.native_build.outcome == 'success' && steps.native_identity.outputs.input_digest != '' }}
        env:
          NATIVE_INPUT_DIGEST: ${{ steps.native_identity.outputs.input_digest }}
        shell: bash
        run: |
          [[ "$NATIVE_INPUT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 2
          printf 'native executed %s (run %s, attempt %s); shadow only, reuse unknown\n' "$NATIVE_INPUT_DIGEST" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
