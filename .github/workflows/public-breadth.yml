name: Lift public eligible breadth
run-name: public-eligible-breadth head=${{ inputs.source_sha || github.sha }}

on:
  schedule:
    - cron: '0 4 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full lowercase source SHA already pushed to this repository
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lift-public-breadth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-eligible-breadth:
    name: Public eligible breadth (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run public eligible breadth with locked dependencies
        run: python3 -B scripts/run-public-breadth.py --install --output public-breadth-evidence
      - name: Retain exact selection, unavailable inputs and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lift-public-breadth-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-breadth-evidence/
          retention-days: 1
          if-no-files-found: error
